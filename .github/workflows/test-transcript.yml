name: 🧪 Test Transcribe Audio

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: "URL audio siaran yang akan ditranskripsi"
        required: false
        default: "https://archive.org/download/vot-denpasar-20261110-183031/VOT-Denpasar_10-11-26-1.mp3"
      whisper_model:
        description: "Model Whisper-CPP (default: large-v3-turbo)"
        required: false
        default: "large-v3-turbo"
        type: choice
        options:
          - large-v3-turbo
          - medium
          - small
          - base
          - tiny
          - large-v3

permissions:
  contents: read

jobs:
  transcribe:
    name: "🎙️ Test Transcribe"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Transcription Environment
        run: python main/setup.py transcript

      - name: Run Transcription (No Upload)
        env:
          AUDIO_URL: ${{ inputs.audio_url || 'https://archive.org/download/vot-denpasar-20261110-183031/VOT-Denpasar_10-11-26-1.mp3' }}
          MODEL: ${{ inputs.whisper_model || 'large-v3-turbo' }}
        run: |
          echo "=========================================================="
          echo "🚀 MEMULAI UJI TRANSKRIPSI (TANPA UPLOAD KE ARCHIVE.ORG)"
          echo "   Audio Target : $AUDIO_URL"
          echo "   Model        : $MODEL"
          echo "=========================================================="
          python3 -u main/transcribe.py "$AUDIO_URL" "$MODEL"

      - name: Generate Summary in GitHub Step Summary
        if: always()
        run: |
          echo "### 🎙️ Hasil Pengujian Transkripsi" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Audio URL**: \`${{ inputs.audio_url || 'https://archive.org/download/vot-denpasar-20261110-183031/VOT-Denpasar_10-11-26-1.mp3' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Model**: \`${{ inputs.whisper_model || 'large-v3-turbo' }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "transcripts/transcript.srt" ]; then
            SEGMENTS=$(grep -c '-->' transcripts/transcript.srt || echo "0")
            TXT_SIZE=$(wc -c < transcripts/transcript.txt 2>/dev/null || echo "0")
            echo "- **Status**: ✅ Sukses diekspor" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Total Segmen SRT**: $SEGMENTS segmen" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Ukuran TXT**: $TXT_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### 📝 Cuplikan Transkrip Awal (30 Baris):" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            head -n 30 transcripts/transcript.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### 📝 Cuplikan Transkrip Akhir (30 Baris):" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 transcripts/transcript.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Status**: ❌ File transkrip tidak ditemukan" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Transcript Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-transcripts-output
          path: transcripts/
          if-no-files-found: ignore
          retention-days: 7
