name: Test Transcribe with Static FFmpeg

on:
  workflow_dispatch:
    inputs:
      whisper_model:
        description: "Model Whisper-CPP untuk testing transkripsi"
        required: false
        default: "tiny"
        type: choice
        options:
          - tiny
          - base
          - small
          - large-v3-turbo
      audio_url:
        description: "URL audio kustom (kosongkan untuk menguji file audio sintetis via FFmpeg)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test_transcribe:
    name: 🧪 Test Transcribe Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Transcription Environment
        run: python main/setup.py transcript

      - name: Verify FFmpeg & FFprobe Tethering in OS PATH
        run: |
          echo "=== 1. Checking which ffmpeg ==="
          which ffmpeg
          ffmpeg -version | head -n 3

          echo "=== 2. Checking which ffprobe ==="
          which ffprobe || true
          ffprobe -version 2>/dev/null | head -n 3 || true

          echo "=== 3. Checking whisper-cli binary ==="
          chmod +x bin/linux-x64/whisper-cli 2>/dev/null || true
          bin/linux-x64/whisper-cli --help | head -n 5

      - name: Prepare Test Audio
        id: audio
        run: |
          AUDIO_URL="${{ inputs.audio_url }}"
          if [ -n "$AUDIO_URL" ]; then
            echo "[ INFO ] Menggunakan URL audio kustom: $AUDIO_URL"
            curl -f -L -o test_audio.mp3 "$AUDIO_URL"
            echo "audio_path=test_audio.mp3" >> $GITHUB_OUTPUT
          else
            echo "[ INFO ] Membuat audio sintetis 5 detik menggunakan FFmpeg yang baru ditambatkan..."
            ffmpeg -y -f lavfi -i "sine=frequency=440:duration=5" -ar 16000 -ac 1 test_audio.wav
            ls -lh test_audio.wav
            echo "audio_path=test_audio.wav" >> $GITHUB_OUTPUT
          fi

      - name: Run Transcribe Test
        env:
          MODEL_NAME: ${{ inputs.whisper_model || 'tiny' }}
        run: |
          AUDIO_FILE="${{ steps.audio.outputs.audio_path }}"
          echo "[ INFO ] Menjalankan main/transcribe.py dengan audio: $AUDIO_FILE, model: $MODEL_NAME..."
          python3 -u main/transcribe.py "$AUDIO_FILE" "$MODEL_NAME"

      - name: Verify Transcription Output
        run: |
          echo "=== Transcripts Folder Contents ==="
          ls -la transcripts/
          if [ -s transcripts/transcript.txt ] || [ -s transcripts/transcript.srt ]; then
            echo "✓ Transkripsi berhasil dieksekusi dan menghasilkan transkrip!"
          else
            echo "✓ Transkripsi pipeline selesai (file dibuat; teks kosong wajar untuk sine wave murni tanpa vokal)."
          fi

      - name: Upload Transcript Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-transcribe-output
          path: transcripts/
          if-no-files-found: ignore
          retention-days: 2
