name: 🧪 Test Parallel Local LLM (DeepSeek R1)

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: "URL download model GGUF (DeepSeek-R1-Distill-Qwen-14B)"
        required: false
        default: "https://huggingface.co/bartowski/DeepSeek-R1-Distill-Qwen-14B-GGUF/resolve/main/DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf"
      model_filename:
        description: "Nama file model GGUF"
        required: false
        default: "DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf"
      context_size:
        description: "Kapasitas context size (tokens)"
        required: false
        default: "32768"

permissions:
  contents: read

concurrency:
  group: test-parallel-llm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test_llm_parallel:
    name: "🧠 ${{ matrix.title }} (${{ matrix.item_id }})"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - item_id: "vot-denpasar-20261107-183001"
            title: "VOT Denpasar - Sabtu, 07 November 2026"
            date: "2026-11-07"

          - item_id: "vot-denpasar-20261106-183004"
            title: "VOT Denpasar - Jumat, 06 November 2026"
            date: "2026-11-06"

          - item_id: "vot-denpasar-20261105-183010"
            title: "VOT Denpasar - Kamis, 05 November 2026"
            date: "2026-11-05"

          - item_id: "vot-denpasar-20261103-183002"
            title: "VOT Denpasar - Selasa, 03 November 2026"
            date: "2026-11-03"

          - item_id: "vot-denpasar-20261102-183004"
            title: "VOT Denpasar - Senin, 02 November 2026"
            date: "2026-11-02"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ── 1. Alokasi Swap 24GB untuk Llama Server ────────────────────────────
      - name: Configure 24GB Swap
        run: |
          echo "=== Ruang Disk Runner ==="
          df -h /
          echo "Mengalokasikan 24GB swapfile tambahan secara instan..."
          sudo fallocate -l 24G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=24576
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          echo "=== Status Memori & Swap ==="
          free -h

      # ── 2. Download Model GGUF dengan aria2c (16 Koneksi Paralel) ──────────
      - name: Download GGUF Model with aria2
        env:
          MODEL_URL: ${{ inputs.model_url }}
          MODEL_FILENAME: ${{ inputs.model_filename }}
        run: |
          mkdir -p "$HOME/qwen"
          MODEL_PATH="$HOME/qwen/$MODEL_FILENAME"
          echo "[ INFO ] Menginstal aria2..."
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2

          echo "[ INFO ] Mengunduh model via aria2c (16 thread paralel)..."
          aria2c -x 16 -s 16 -k 1M --file-allocation=none \
            --allow-overwrite=true --auto-file-renaming=false \
            --summary-interval=5 --console-log-level=warn \
            -d "$HOME/qwen" -o "$MODEL_FILENAME" "$MODEL_URL"

          echo "[ OK ] Download selesai:"
          ls -lh "$MODEL_PATH"

      # ── 3. Ambil Transkrip yang Sudah Ada di Archive.org & Jalankan clean.py ─
      - name: Prepare Existing Transcript from Archive.org
        env:
          ITEM_ID: ${{ matrix.item_id }}
        run: |
          mkdir -p transcripts
          python3 - << 'EOF'
          import urllib.request, re, time, os, sys

          item_id = os.environ["ITEM_ID"]
          dest = "transcripts/transcript.srt"
          sources = [
              f"https://archive.org/download/{item_id}/transcript.srt",
              f"https://voiceoftrisma.anandapradnyana68.workers.dev/archive/download/{item_id}/transcript.srt",
              f"https://archive.org/download/{item_id}/transcript.txt",
              f"https://voiceoftrisma.anandapradnyana68.workers.dev/archive/download/{item_id}/transcript.txt",
          ]

          success = False
          for attempt in range(1, 6):
              for url in sources:
                  try:
                      print(f"[INFO] Mengunduh transkrip (Percobaan {attempt}/5): {url}...")
                      req = urllib.request.Request(url, headers={
                          "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
                      })
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          if resp.status != 200:
                              print(f"[WARN] HTTP {resp.status} dari {url}")
                              continue
                          expected_len = resp.headers.get("Content-Length")
                          data = resp.read()

                          # Cegah unduhan terpotong / parsial akibat koneksi lambat
                          if expected_len and len(data) < int(expected_len):
                              print(f"[WARN] Unduhan tidak utuh: diterima {len(data)} dari {expected_len} bytes!")
                              continue

                          text = data.decode("utf-8", errors="ignore")
                          # Deteksi halaman error HTML / 503 / 502
                          if "<html" in text.lower() or "<!doctype" in text.lower() or "503 service" in text.lower():
                              print(f"[WARN] Menerima halaman error HTML / 503 dari {url}")
                              continue

                          # Verifikasi format SRT (harus ada minimal 10 timestamp)
                          timestamps = re.findall(r"(\d{2}:\d{2}:\d{2})", text)
                          if len(timestamps) < 10:
                              print(f"[WARN] Berkas tidak memuat timestamp SRT yang cukup!")
                              continue

                          with open(dest, "wb") as f:
                              f.write(data)
                          print(f"[OK] transcript.srt utuh & valid ({len(data)} bytes, {len(text.splitlines())} baris, durasi hingga: {timestamps[-1]})")
                          success = True
                          break
                  except Exception as e:
                      print(f"[WARN] Gagal dari {url}: {e}")
              if success:
                  break
              print(f"[INFO] Menunggu {attempt * 3} detik sebelum mencoba kembali...")
              time.sleep(attempt * 3)

          if not success:
              print(f"[FATAL] Gagal mengunduh transkrip utuh untuk {item_id}!")
              sys.exit(1)
          EOF
          echo "[ INFO ] Membersihkan transkrip dengan main/clean.py..."
          python3 main/clean.py transcripts/transcript.srt > clean.txt
          echo "[ OK ] clean.txt selesai dibuat: $(wc -l < clean.txt) baris."
          echo "Rentang awal transkrip : $(head -n 1 clean.txt | cut -c 1-90)..."
          echo "Rentang akhir transkrip: $(tail -n 1 clean.txt | cut -c 1-90)..."

      # ── 4. Jalankan llama-server di Background ──────────────────────────────
      - name: Start Llama Server
        env:
          MODEL_FILENAME: ${{ inputs.model_filename }}
          CTX_SIZE: ${{ inputs.context_size }}
        run: |
          chmod +x bin/linux-x64/llama-server
          MODEL_PATH="$HOME/qwen/$MODEL_FILENAME"

          echo "[ INFO ] Memulai llama-server pada port 8080..."
          nohup ./bin/linux-x64/llama-server \
            -m "$MODEL_PATH" \
            -c "$CTX_SIZE" \
            -b 512 \
            -ub 256 \
            -t $(nproc) \
            --jinja \
            --port 8080 > server.log 2>&1 &

          echo "[ INFO ] Menunggu server siap merespons..."
          READY=0
          for i in $(seq 1 120); do
            if curl -s http://127.0.0.1:8080/health | grep -qi "ok\|ready\|status"; then
              echo "[ OK ] llama-server siap merespons!"
              READY=1
              break
            fi
            echo "Menunggu inisialisasi model ($i/120)..."
            sleep 5
          done

          if [ $READY -eq 0 ]; then
            echo "[ ERROR ] llama-server gagal siap dalam waktu 10 menit!"
            echo "=== Isi server.log ==="
            cat server.log
            exit 1
          fi

      # ── 5. Jalankan ask.py untuk Inferensi DeepSeek R1 ───────────────────────
      - name: Run Inference (ask.py)
        run: |
          echo "[ INFO ] Mengirim prompt sistem dan clean.txt ke llama-server..."
          python3 -u main/ask.py main/prompt.txt clean.txt out.json http://127.0.0.1:8080/v1/chat/completions
          echo "=== Hasil out.json ==="
          cat out.json

      # ── 6. Log Ringkasan Hasil ke GitHub Step Summary ──────────────────────
      - name: Log Step Summary
        if: always()
        env:
          ITEM_ID: ${{ matrix.item_id }}
          TITLE: ${{ matrix.title }}
          BROADCAST_DATE: ${{ matrix.date }}
          MODEL_FILENAME: ${{ inputs.model_filename }}
        run: |
          echo "### 🧠 Hasil Inferensi LLM: $TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Archive Item ID**: [\`$ITEM_ID\`](https://archive.org/details/$ITEM_ID)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tanggal Siaran**: \`$BROADCAST_DATE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Model LLM**: \`$MODEL_FILENAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status Eksekusi**: ${{ job.status == 'success' && '✅ Berhasil' || '❌ Gagal' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Archive Upload**: 🚫 *Dinonaktifkan (Uji Coba Eksekusi Paralel - Tanpa Upload)*" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -s think.txt ]; then
            echo "<details><summary>💭 Lihat Jalur Penalaran (&lt;think&gt; trace)</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat think.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s out.json ]; then
            echo "#### 📄 Output JSON Terformat:" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat out.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 7. Simpan Artifact Hasil Uji Coba (Tanpa Upload Archive.org) ─────────
      - name: Upload LLM Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-${{ matrix.item_id }}
          path: |
            out.json
            think.txt
            clean.txt
            server.log
            transcripts/transcript.srt
          retention-days: 7
