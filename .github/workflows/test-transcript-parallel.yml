name: 🧪 Test Parallel Transcription (Whisper)

on:
  workflow_dispatch:
    inputs:
      whisper_model:
        description: "Model Whisper-CPP untuk transkripsi"
        required: false
        default: "small"
        type: choice
        options:
          - small
          - medium
          - base
          - tiny
      item_id:
        description: "Filter ke 1 Item ID tertentu (kosongkan untuk menjalankan seluruh 5 siaran secara paralel)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: test-transcript-parallel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transcribe_parallel:
    name: "🎙️ ${{ matrix.title }} (${{ matrix.item_id }})"
    if: inputs.item_id == '' || inputs.item_id == matrix.item_id
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - item_id: "vot-denpasar-20261107-183001"
            title: "VOT Denpasar - Sabtu, 07 November 2026"
            audio_url: "https://archive.org/download/vot-denpasar-20261107-183001/VOT-Denpasar_07-11-26-0.mp3"
            date: "2026-11-07"

          - item_id: "vot-denpasar-20261106-183004"
            title: "VOT Denpasar - Jumat, 06 November 2026"
            audio_url: "https://archive.org/download/vot-denpasar-20261106-183004/VOT-Denpasar_06-11-26-0.mp3"
            date: "2026-11-06"

          - item_id: "vot-denpasar-20261105-183010"
            title: "VOT Denpasar - Kamis, 05 November 2026"
            audio_url: "https://archive.org/download/vot-denpasar-20261105-183010/VOT-Denpasar_05-11-26-0.mp3"
            date: "2026-11-05"

          - item_id: "vot-denpasar-20261103-183002"
            title: "VOT Denpasar - Selasa, 03 November 2026"
            audio_url: "https://archive.org/download/vot-denpasar-20261103-183002/VOT-Denpasar_03-11-26-0.mp3"
            date: "2026-11-03"

          - item_id: "vot-denpasar-20261102-183004"
            title: "VOT Denpasar - Senin, 02 November 2026"
            audio_url: "https://archive.org/download/vot-denpasar-20261102-183004/VOT-Denpasar_02-11-26-0.mp3"
            date: "2026-11-02"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ── 1. Setup Lingkungan Whisper-CPP & FFmpeg ───────────────────────────
      - name: Setup Transcription Environment
        run: |
          python main/setup.py transcript

      # ── 2. Download Audio & Transcribe dengan Whisper.cpp ──────────────────
      - name: Transcribe Audio
        env:
          ITEM_ID: ${{ matrix.item_id }}
          AUDIO_URL: ${{ matrix.audio_url }}
          WHISPER_MODEL: ${{ inputs.whisper_model || 'small' }}
        run: |
          MODEL="${WHISPER_MODEL:-small}"
          if [ "$MODEL" = "true" ] || [ -z "$MODEL" ]; then
            MODEL="small"
          fi
          echo "=========================================================="
          echo "[ INFO ] Item ID       : $ITEM_ID"
          echo "[ INFO ] Audio URL     : $AUDIO_URL"
          echo "[ INFO ] Whisper Model : $MODEL"
          echo "=========================================================="
          python3 -u main/transcribe.py "$AUDIO_URL" "$MODEL"

      # ── 3. Buat Ringkasan Metadata JSON (summary.json) ─────────────────────
      - name: Generate Summary JSON
        if: always()
        env:
          ITEM_ID: ${{ matrix.item_id }}
          TITLE: ${{ matrix.title }}
          AUDIO_URL: ${{ matrix.audio_url }}
          BROADCAST_DATE: ${{ matrix.date }}
          WHISPER_MODEL: ${{ inputs.whisper_model || 'small' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - << 'EOF'
          import json, os, datetime
          
          item_id = os.environ.get("ITEM_ID", "unknown")
          title = os.environ.get("TITLE", "")
          audio_url = os.environ.get("AUDIO_URL", "")
          broadcast_date = os.environ.get("BROADCAST_DATE", "")
          whisper_model = os.environ.get("WHISPER_MODEL", "small")
          job_status = os.environ.get("JOB_STATUS", "unknown")
          
          transcripts_dir = "transcripts"
          os.makedirs(transcripts_dir, exist_ok=True)
          
          file_stats = {}
          line_stats = {}
          if os.path.isdir(transcripts_dir):
              for f in sorted(os.listdir(transcripts_dir)):
                  p = os.path.join(transcripts_dir, f)
                  if os.path.isfile(p):
                      file_stats[f] = os.path.getsize(p)
                      if f.endswith((".txt", ".srt")):
                          try:
                              with open(p, "r", encoding="utf-8", errors="ignore") as fh:
                                  line_stats[f] = len(fh.readlines())
                          except Exception:
                              pass
          
          summary = {
              "item_id": item_id,
              "title": title,
              "date": broadcast_date,
              "audio_url": audio_url,
              "whisper_model": whisper_model,
              "status": job_status,
              "timestamp_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "files": file_stats,
              "lines": line_stats
          }
          
          summary_path = os.path.join(transcripts_dir, "summary.json")
          with open(summary_path, "w", encoding="utf-8") as out:
              json.dump(summary, out, indent=2, ensure_ascii=False)
          print(f"[ OK ] Summary JSON berhasil dibuat di {summary_path}:")
          print(json.dumps(summary, indent=2))
          EOF

      # ── 4. Log Ringkasan Hasil ke GitHub Step Summary ──────────────────────
      - name: Log Step Summary
        if: always()
        env:
          ITEM_ID: ${{ matrix.item_id }}
          TITLE: ${{ matrix.title }}
          AUDIO_URL: ${{ matrix.audio_url }}
          BROADCAST_DATE: ${{ matrix.date }}
          WHISPER_MODEL: ${{ inputs.whisper_model || 'small' }}
        run: |
          echo "### 🎙️ Hasil Transkripsi: $TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Archive Item ID**: [\`$ITEM_ID\`](https://archive.org/details/$ITEM_ID)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tanggal Siaran**: \`$BROADCAST_DATE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tautan Audio Sumber**: [$AUDIO_URL]($AUDIO_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Model Whisper**: \`$WHISPER_MODEL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status Transkripsi**: ${{ job.status == 'success' && '✅ Berhasil' || '❌ Gagal' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Archive Upload**: 🚫 *Dinonaktifkan (Uji Coba Transkripsi Paralel - Tanpa Upload)*" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ -d "transcripts" ]; then
            echo "#### 📦 Berkas Hasil Transkripsi (Folder \`transcripts/\`):" >> "$GITHUB_STEP_SUMMARY"
            echo "| Berkas | Ukuran | Deskripsi |" >> "$GITHUB_STEP_SUMMARY"
            echo "| :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
            for f in transcripts/*; do
              if [ -f "$f" ]; then
                fname=$(basename "$f")
                fsize=$(ls -lh "$f" | awk '{print $5}')
                desc="Data output"
                case "$fname" in
                  transcript.srt) desc="Subtitel SRT dengan timestamp" ;;
                  transcript.txt) desc="Teks transkrip polos lengkap" ;;
                  transcript.json) desc="Output detail JSON dari Whisper.cpp" ;;
                  summary.json) desc="Metadata ringkasan pengujian transkripsi" ;;
                esac
                echo "| \`$fname\` | $fsize | $desc |" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
            
            if [ -s "transcripts/transcript.srt" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "<details><summary>📜 Cuplikan Subtitle SRT (15 Baris Pertama)</summary>" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              head -n 15 transcripts/transcript.srt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            fi
            
            if [ -s "transcripts/summary.json" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "<details><summary>📊 Rincian Metadata summary.json</summary>" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat transcripts/summary.json >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # ── 5. Simpan Artifact Hasil Uji Coba (Tanpa Upload Archive.org) ─────────
      - name: Upload Transcript Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ matrix.item_id }}
          path: transcripts/
          if-no-files-found: warn
          retention-days: 7
