name: 🧪 Test Parallel Local LLM (Reasoning Models)

on:
  workflow_dispatch:
    inputs:
      model_preset:
        description: "Pilihan preset model LLM reasoning"
        type: choice
        required: true
        default: "gpt-oss-20b"
        options:
          - "qwen3.6-35b-q5"
          - "qwen3.6-35b-q6"
          - "qwen3.6-35b-q8"
          - "qwen3.6-35b-claude-opus"
          - "gpt-oss-20b"
          - "qwen3-4b-thinking"
          - "qwen3-30b-thinking-q3"
          - "qwen3-14b-claude-opus"
          - "deepseek-r1-14b"
          - "custom"
      reasoning_effort:
        description: "Parameter reasoning_effort (opsional, 'default' mengikuti preset: gpt-oss-20b=high, lainnya=none)"
        required: false
        default: "default"
      model_url:
        description: "URL download model GGUF (opsional: isi jika preset='custom' atau ingin override URL)"
        required: false
        default: ""
      model_filename:
        description: "Nama file model GGUF (opsional: isi jika preset='custom' atau ingin override filename)"
        required: false
        default: ""
      context_size:
        description: "Kapasitas context size (tokens)"
        required: false
        default: "32768"

permissions:
  contents: read

concurrency:
  group: test-parallel-llm-${{ inputs.model_preset || 'custom' }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test_llm_parallel:
    name: "🧠 [${{ inputs.model_preset || 'llm' }}] ${{ matrix.title }} (${{ matrix.item_id }})"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - item_id: "vot-denpasar-20261107-183001"
            title: "VOT Denpasar - Sabtu, 07 November 2026"
            date: "2026-11-07"

          - item_id: "vot-denpasar-20261106-183004"
            title: "VOT Denpasar - Jumat, 06 November 2026"
            date: "2026-11-06"

          - item_id: "vot-denpasar-20261105-183010"
            title: "VOT Denpasar - Kamis, 05 November 2026"
            date: "2026-11-05"

          - item_id: "vot-denpasar-20261103-183002"
            title: "VOT Denpasar - Selasa, 03 November 2026"
            date: "2026-11-03"

          - item_id: "vot-denpasar-20261102-183004"
            title: "VOT Denpasar - Senin, 02 November 2026"
            date: "2026-11-02"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ── 1. Resolusi Konfigurasi Model & Reasoning Effort ───────────────────
      - name: Resolve Model Configuration
        id: model_cfg
        run: |
          PRESET="${{ inputs.model_preset }}"
          CUSTOM_URL="${{ inputs.model_url }}"
          CUSTOM_FILENAME="${{ inputs.model_filename }}"
          USER_REASONING="${{ inputs.reasoning_effort }}"
          SWAP_SIZE="24G"
          case "$PRESET" in
            "gpt-oss-20b")
              URL="https://huggingface.co/unsloth/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-Q4_K_M.gguf"
              FILENAME="gpt-oss-20b-Q4_K_M.gguf"
              DEFAULT_REASONING="high"
              SWAP_SIZE="24G"
              ;;
            "qwen3-4b-thinking")
              URL="https://huggingface.co/unsloth/Qwen3-4B-Thinking-2507-GGUF/resolve/main/Qwen3-4B-Thinking-2507-Q4_K_M.gguf"
              FILENAME="Qwen3-4B-Thinking-2507-Q4_K_M.gguf"
              DEFAULT_REASONING=""
              SWAP_SIZE="16G"
              ;;
            "qwen3-30b-thinking-q3")
              URL="https://huggingface.co/unsloth/Qwen3-30B-A3B-Thinking-2507-GGUF/resolve/main/Qwen3-30B-A3B-Thinking-2507-Q3_K_M.gguf"
              FILENAME="Qwen3-30B-A3B-Thinking-2507-Q3_K_M.gguf"
              DEFAULT_REASONING=""
              SWAP_SIZE="24G"
              ;;
            "qwen3-14b-claude-opus")
              URL="https://huggingface.co/TeichAI/Qwen3-14B-Claude-4.5-Opus-High-Reasoning-Distill-GGUF/resolve/main/Qwen3-14B-Claude-4.5-Opus-Distill.q4_k_m.gguf"
              FILENAME="Qwen3-14B-Claude-4.5-Opus-Distill.q4_k_m.gguf"
              DEFAULT_REASONING=""
              SWAP_SIZE="24G"
              ;;
            "qwen3.6-35b-q5")
              URL="https://huggingface.co/Sparkplugx1904/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled-GGUF/resolve/main/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.Q5_K_M.gguf"
              FILENAME="Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.Q5_K_M.gguf"
              DEFAULT_REASONING=""
              SWAP_SIZE="28G"
              ;;
            "qwen3.6-35b-q6")
              URL="https://huggingface.co/Sparkplugx1904/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled-GGUF/resolve/main/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.Q6_K.gguf"
              FILENAME="Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.Q6_K.gguf"
              DEFAULT_REASONING=""
              SWAP_SIZE="32G"
              ;;
            "qwen3.6-35b-q8")
              URL="https://huggingface.co/Sparkplugx1904/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled-GGUF/resolve/main/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.Q8_0.gguf"
              FILENAME="Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.Q8_0.gguf"
              DEFAULT_REASONING=""
              SWAP_SIZE="40G"
              ;;
            "qwen3.6-35b-claude-opus"|"qwen3.6-35b-q4")
              URL="https://huggingface.co/Sparkplugx1904/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled-GGUF/resolve/main/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.Q4_K_M.gguf"
              FILENAME="Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.Q4_K_M.gguf"
              DEFAULT_REASONING=""
              SWAP_SIZE="24G"
              ;;
            "deepseek-r1-14b")
              URL="https://huggingface.co/bartowski/DeepSeek-R1-Distill-Qwen-14B-GGUF/resolve/main/DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf"
              FILENAME="DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf"
              DEFAULT_REASONING=""
              SWAP_SIZE="24G"
              ;;
            *)
              URL=""
              FILENAME=""
              DEFAULT_REASONING=""
              SWAP_SIZE="24G"
              ;;
          esac
          # Override jika disediakan secara manual
          if [ -n "$CUSTOM_URL" ]; then
            URL="$CUSTOM_URL"
          fi
          if [ -n "$CUSTOM_FILENAME" ]; then
            FILENAME="$CUSTOM_FILENAME"
          fi

          if [ -n "$USER_REASONING" ] && [ "$USER_REASONING" != "default" ]; then
            REASONING="$USER_REASONING"
          else
            REASONING="$DEFAULT_REASONING"
          fi

          if [ -z "$URL" ] || [ -z "$FILENAME" ]; then
            echo "[ ERROR ] Model URL dan Filename tidak boleh kosong!"
            exit 1
          fi

          echo "RESOLVED_MODEL_URL=$URL" >> $GITHUB_ENV
          echo "RESOLVED_MODEL_FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "RESOLVED_REASONING_EFFORT=$REASONING" >> $GITHUB_ENV
          echo "RESOLVED_SWAP_SIZE=$SWAP_SIZE" >> $GITHUB_ENV

          echo "=== Konfigurasi Model Terpilih ==="
          echo "Preset           : $PRESET"
          echo "Model Filename   : $FILENAME"
          echo "Model URL        : $URL"
          echo "Reasoning Effort : $REASONING"
          echo "Swap Size        : $SWAP_SIZE"
      # ── 2. Alokasi Swap 24GB untuk Llama Server ────────────────────────────
      - name: Configure 24GB Swap
        run: |
          echo "=== Membersihkan Ruang Disk Runner ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true
          df -h /
          echo "Mengalokasikan ${RESOLVED_SWAP_SIZE:-24G} swapfile tambahan secara instan..."
          sudo fallocate -l "${RESOLVED_SWAP_SIZE:-24G}" /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=24576
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          echo "=== Status Memori & Swap ==="
          free -h

      # ── 3. Download Model GGUF dengan aria2c (16 Koneksi Paralel) ──────────
      - name: Download GGUF Model with aria2
        env:
          MODEL_URL: ${{ env.RESOLVED_MODEL_URL }}
          MODEL_FILENAME: ${{ env.RESOLVED_MODEL_FILENAME }}
        run: |
          mkdir -p "$HOME/qwen"
          MODEL_PATH="$HOME/qwen/$MODEL_FILENAME"
          echo "[ INFO ] Menginstal aria2..."
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2

          echo "[ INFO ] Mengunduh model via aria2c (16 thread paralel)..."
          aria2c -x 16 -s 16 -k 1M --file-allocation=none \
            --allow-overwrite=true --auto-file-renaming=false \
            --summary-interval=5 --console-log-level=warn \
            -d "$HOME/qwen" -o "$MODEL_FILENAME" "$MODEL_URL"

          echo "[ OK ] Download selesai:"
          ls -lh "$MODEL_PATH"

      # ── 4. Ambil Transkrip yang Sudah Ada di Archive.org & Jalankan clean.py ─
      - name: Prepare Existing Transcript from Archive.org
        env:
          ITEM_ID: ${{ matrix.item_id }}
        run: |
          mkdir -p transcripts
          python3 -c "
          from pathlib import Path
          from main.core.downloader import download_archive_file
          import os, sys
          item = os.environ['ITEM_ID']
          url = f'https://archive.org/download/{item}/transcript.srt'
          dest = Path('transcripts/transcript.srt')
          if not download_archive_file(url, dest, is_text=True):
              sys.exit(1)
          "
          echo "[ INFO ] Membersihkan transkrip dengan main/clean.py..."
          python3 main/clean.py transcripts/transcript.srt > clean.txt
          echo "[ OK ] clean.txt selesai dibuat: $(wc -l < clean.txt) baris."
          echo "Rentang awal transkrip : $(head -n 1 clean.txt | cut -c 1-90)..."
          echo "Rentang akhir transkrip: $(tail -n 1 clean.txt | cut -c 1-90)..."

      # ── 5. Jalankan llama-server di Background ──────────────────────────────
      - name: Start Llama Server
        env:
          MODEL_FILENAME: ${{ env.RESOLVED_MODEL_FILENAME }}
          CTX_SIZE: ${{ inputs.context_size }}
        run: |
          chmod +x bin/linux-x64/llama-server
          MODEL_PATH="$HOME/qwen/$MODEL_FILENAME"

          echo "[ INFO ] Memulai llama-server pada port 8080..."
          nohup ./bin/linux-x64/llama-server \
            -m "$MODEL_PATH" \
            -c "$CTX_SIZE" \
            -b 512 \
            -ub 256 \
            -t $(nproc) \
            --jinja \
            --port 8080 > server.log 2>&1 &

          echo "[ INFO ] Menunggu server siap merespons..."
          READY=0
          for i in $(seq 1 120); do
            if curl -s http://127.0.0.1:8080/health | grep -qi "ok\|ready\|status"; then
              echo "[ OK ] llama-server siap merespons!"
              READY=1
              break
            fi
            echo "Menunggu inisialisasi model ($i/120)..."
            sleep 5
          done

          if [ $READY -eq 0 ]; then
            echo "[ ERROR ] llama-server gagal siap dalam waktu 10 menit!"
            echo "=== Isi server.log ==="
            cat server.log
            exit 1
          fi

      # ── 6. Jalankan ask.py untuk Inferensi LLM ──────────────────────────────
      - name: Run Inference (ask.py)
        env:
          REASONING_EFFORT: ${{ env.RESOLVED_REASONING_EFFORT }}
        run: |
          echo "[ INFO ] Mengirim prompt sistem dan clean.txt ke llama-server..."
          python3 -u main/ask.py main/prompt.txt clean.txt out.json http://127.0.0.1:8080/v1/chat/completions "$REASONING_EFFORT"
          echo "=== Hasil out.json ==="
          cat out.json

      # ── 7. Log Ringkasan Hasil ke GitHub Step Summary ──────────────────────
      - name: Log Step Summary
        if: always()
        env:
          ITEM_ID: ${{ matrix.item_id }}
          TITLE: ${{ matrix.title }}
          BROADCAST_DATE: ${{ matrix.date }}
          MODEL_PRESET: ${{ inputs.model_preset }}
          MODEL_FILENAME: ${{ env.RESOLVED_MODEL_FILENAME }}
          REASONING_EFFORT: ${{ env.RESOLVED_REASONING_EFFORT }}
        run: |
          echo "### 🧠 Hasil Inferensi LLM: $TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Archive Item ID**: [\`$ITEM_ID\`](https://archive.org/details/$ITEM_ID)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tanggal Siaran**: \`$BROADCAST_DATE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Model Preset**: \`$MODEL_PRESET\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Model Filename**: \`$MODEL_FILENAME\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REASONING_EFFORT" ]; then
            echo "- **Reasoning Effort**: \`$REASONING_EFFORT\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Status Eksekusi**: ${{ job.status == 'success' && '✅ Berhasil' || '❌ Gagal' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Archive Upload**: 🚫 *Dinonaktifkan (Uji Coba Eksekusi Paralel - Tanpa Upload)*" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -s think.txt ]; then
            echo "<details><summary>💭 Lihat Jalur Penalaran (&lt;think&gt; trace)</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat think.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s out.json ]; then
            echo "#### 📄 Output JSON Terformat:" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat out.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 8. Simpan Artifact Hasil Uji Coba (Tanpa Upload Archive.org) ─────────
      - name: Upload LLM Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-${{ inputs.model_preset || 'run' }}-${{ matrix.item_id }}
          path: |
            out.json
            think.txt
            clean.txt
            server.log
            transcripts/transcript.srt
          retention-days: 7
