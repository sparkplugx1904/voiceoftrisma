name: Record and Transcribe v2.0

on:
  workflow_dispatch:
    inputs:
      whisper_model:
        description: "Model Whisper-CPP untuk transkripsi"
        required: false
        default: "large-v3-turbo"
        type: choice
        options:
          - large-v3-turbo
          - large-turbo-v3
          - medium
          - small
  # schedule:
  #   - cron: "0 5 * * *"   # Tiap hari jam 05:00 UTC (~13:00 WITA)

jobs:
  record:
    name: 🎙️ Record Stream and Upload
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suffix: ["-s 1 -p 1 --random-proxy stats --start-time 15:30"]
        # suffix: ["-s 1 -p 1 --random-proxy stats"]
        # suffix: ["-s 0 -p 0 --random-proxy stats --no-upload --no-timer-limit"]
        # suffix: ["-s 0 -p 0"]
    outputs:
      url_s1p1: ${{ steps.map.outputs.url_s1p1 }}
      id_s1p1:  ${{ steps.map.outputs.id_s1p1 }}

    steps:
      - uses: actions/checkout@v4

      # - name: Setup Cloudflare WARP
      #   uses: fscarmen/warp-on-actions@v1.4
      #   with:
      #     stack: dual

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup recording environment
        run: python main/setup.py record

      - name: Run recorder (auto-export ENV)
        id: record
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          STREAM_URL: ${{ secrets.STREAM_URL }}

        run: |
          mkdir -p recordings
          python3 -u main/record_v2.py ${{ matrix.suffix }}

      - name: Map environment vars to matrix outputs
        id: map
        run: |
          echo "[ INFO ] Global env values:"
          echo "  ARCHIVE_URL: $ARCHIVE_URL"
          echo "  ITEM_ID: $ITEM_ID"

          if [[ -z "$ARCHIVE_URL" || -z "$ITEM_ID" ]]; then
            echo "[ ERROR ] Environment variables missing!"
            exit 1
          fi

          echo "url_s1p1=$ARCHIVE_URL" >> $GITHUB_OUTPUT
          echo "id_s1p1=$ITEM_ID" >> $GITHUB_OUTPUT
          echo "[ OK ] Environment successfully mapped to job outputs."

      - name: Waiting...
        run: sleep 600

  transcribe:
    name: 🎙️ Transcribe Audio and Push SRT
    needs: record
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pair:
          - { suffix: "s1p1", url: "${{ needs.record.outputs.url_s1p1 }}", item: "${{ needs.record.outputs.id_s1p1 }}" }

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup transcription environment
        run: python main/setup.py transcript

      - name: Transcribe audio
        env:
          WHISPER_MODEL: ${{ inputs.whisper_model }}
        run: |
          MODEL="${WHISPER_MODEL:-large-v3-turbo}"
          echo "[ INFO ] Transcribing audio_${{ matrix.pair.suffix }}.mp3 menggunakan model $MODEL..."
          python3 -u main/transcribe.py "${{ matrix.pair.url }}" "$MODEL"

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: vot-transcript-${{ matrix.pair.suffix }}
          path: transcripts/

      - name: Push transcript SRT to Archive.org
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          ITEM_ID: ${{ matrix.pair.item }}
        run: |
          python3 -u main/archive.py

  describe:
    name: 🧠 Generate Description with Qwen LLM
    needs: [record, transcribe]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pair:
          - { suffix: "s1p1", item: "${{ needs.record.outputs.id_s1p1 }}" }

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Description Environment
        run: python main/setup.py descript

      - name: Configure 40GB Swap
        run: |
          echo "=== Membersihkan Ruang Disk Runner ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true
          df -h /
          echo "Mengalokasikan 40GB swapfile untuk Qwen 35B Q8_0..."
          sudo fallocate -l 40G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=40960
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: Download Qwen3.6-35B Model (Q8_0)
        run: |
          mkdir -p "$HOME/qwen"
          MODEL_URL="https://huggingface.co/Sparkplugx1904/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled-GGUF/resolve/main/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.Q8_0.gguf"
          MODEL_FILE="Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.Q8_0.gguf"
          echo "[ INFO ] Mengunduh model Qwen 35B Q8_0 via aria2c..."
          aria2c -x 16 -s 16 -k 1M --file-allocation=none \
            --allow-overwrite=true --auto-file-renaming=false \
            -d "$HOME/qwen" -o "$MODEL_FILE" "$MODEL_URL"
          echo "MODEL_PATH=$HOME/qwen/$MODEL_FILE" >> $GITHUB_ENV

      - name: Download Transcript Artifact
        uses: actions/download-artifact@v4
        with:
          name: vot-transcript-${{ matrix.pair.suffix }}
          path: transcripts/

      - name: Start Llama Server
        run: |
          chmod +x bin/linux-x64/llama-server
          nohup ./bin/linux-x64/llama-server \
            -m "$MODEL_PATH" \
            -c 32768 \
            -b 512 \
            -ub 256 \
            -t $(nproc) \
            --jinja \
            --port 8080 > server.log 2>&1 &
          READY=0
          for i in $(seq 1 120); do
            if curl -s http://127.0.0.1:8080/health | grep -qi "ok\|ready\|status"; then
              echo "[ OK ] llama-server siap merespons!"
              READY=1
              break
            fi
            sleep 5
          done
          if [ $READY -eq 0 ]; then
            echo "[ ERROR ] llama-server gagal siap!"
            cat server.log
            exit 1
          fi

      - name: Generate Description from SRT
        run: |
          echo "[ INFO ] Membersihkan transkrip dengan clean.py..."
          python3 main/clean.py transcripts/transcript.srt > clean.txt
          echo "[ INFO ] Menghasilkan description.json via Qwen LLM..."
          python3 -u main/ask.py main/prompt.txt clean.txt transcripts/description.json http://127.0.0.1:8080/v1/chat/completions
          cat transcripts/description.json

      - name: Upload Description Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vot-description-${{ matrix.pair.suffix }}
          path: transcripts/description.json

      - name: Push Description to Archive.org
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          ITEM_ID: ${{ matrix.pair.item }}
        run: |
          python3 -u main/archive.py
