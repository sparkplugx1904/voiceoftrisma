name: Pipeline Guard

on:
  # Jadwal cron internal GHA dinonaktifkan — dialihkan ke Cloudflare Worker cron trigger (0 * * * *)
  # schedule:
  #   # Transcribe only: tiap 6 jam (WITA 00:00, 06:00, 12:00, 18:00 = UTC 16:00, 22:00, 04:00, 10:00)
  #   - cron: "0 4,10,16,22 * * *"
  #   # Describe only: tiap 1 jam sekali (menit 30 agar terpisah dan tidak bertabrakan dengan transcribe)
  #   - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Jumlah rekaman maksimal yang diproses (kosong = otomatis: 10 transcribe, 5 describe)"
        required: false
        default: ""
      max_scan:
        description: "Jumlah rekaman terbaru yang diperiksa (default: 1000)"
        required: false
        default: "1000"
      item_id:
        description: "Archive.org Item ID tertentu (kosongkan jika scan otomatis)"
        required: false
        default: ""
      mode:
        description: "Strategi prioritas perbaikan arsip"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - describe_first
          - transcribe_only
          - describe_only
          - balanced
      whisper_model:
        description: "Model Whisper-CPP untuk transkripsi"
        required: false
        default: "medium"
        type: choice
        options:
          - medium
          - small
          - base
          - tiny
      qwen_quant:
        description: "Kuantisasi model Qwen3.6-35B-A3B untuk deskripsi"
        required: false
        default: "Q8_0"
        type: choice
        options:
          - Q8_0
          - Q6_K
          - Q4_K_M

permissions:
  contents: read

# Satu run per mode (transcribe_only vs describe_only); run baru menunggu yang lama selesai
concurrency:
  group: pipeline-guard-${{ inputs.mode || github.run_id }}
  cancel-in-progress: false

jobs:
  scan:
    name: 🔍 Scan Archive Recordings
    runs-on: ubuntu-latest
    outputs:
      transcribe_matrix: ${{ steps.scan.outputs.transcribe_matrix }}
      describe_matrix: ${{ steps.scan.outputs.describe_matrix }}
      has_transcribe: ${{ steps.scan.outputs.has_transcribe }}
      has_describe: ${{ steps.scan.outputs.has_describe }}
      count: ${{ steps.scan.outputs.count }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scan Archive.org Items
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_MAX_SCAN: ${{ inputs.max_scan }}
          INPUT_ITEM_ID: ${{ inputs.item_id }}
        run: |
          ITEM_ARG=""
          if [ -n "$INPUT_ITEM_ID" ]; then
            ITEM_ARG="--item-id $INPUT_ITEM_ID"
          fi

          MAX_SCAN="${INPUT_MAX_SCAN:-1000}"

          # Penentuan mode & limit:
          # - transcribe: 10 worker paralel
          # - describe: 5 worker paralel
          MODE="${INPUT_MODE:-auto}"
          if [ -n "$INPUT_LIMIT" ]; then
            LIMIT="$INPUT_LIMIT"
          elif [ "$MODE" = "transcribe_only" ]; then
            LIMIT=10
          elif [ "$MODE" = "describe_only" ]; then
            LIMIT=5
          else
            LIMIT=15
          fi
          echo "Event: $EVENT_NAME | Mode: $MODE | Limit: $LIMIT | Max scan: $MAX_SCAN"

          python main/guard.py scan \
            --limit "$LIMIT" \
            --max-scan "$MAX_SCAN" \
            --mode "$MODE" \
            $ITEM_ARG \
            --export-github-output

  transcribe:
    name: "🎙️ Transcribe: ${{ matrix.item_id }}"
    needs: scan
    if: needs.scan.outputs.has_transcribe == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJson(needs.scan.outputs.transcribe_matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Transcription Environment
        if: matrix.action != 'skip'
        run: python main/setup.py transcript

      - name: Transcribe Audio
        if: matrix.action != 'skip'
        env:
          ITEM_ID: ${{ matrix.item_id }}
          AUDIO_URL: ${{ matrix.audio_url }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
        run: |
          MODEL="${WHISPER_MODEL:-medium}"
          if [ "$MODEL" = "true" ] || [ -z "$MODEL" ]; then
            MODEL="medium"
          fi
          echo "[ INFO ] Transcribing $ITEM_ID dari $AUDIO_URL menggunakan model: $MODEL..."
          python3 -u main/transcribe.py "$AUDIO_URL" "$MODEL"

      - name: Upload Transcript Artifact
        if: always() && matrix.action != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: guard-transcript-${{ matrix.item_id }}
          path: transcripts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Push Transcript to Archive.org
        if: matrix.action != 'skip'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          ITEM_ID: ${{ matrix.item_id }}
        run: |
          python3 -u main/archive.py

      - name: Log Step Summary
        if: always() && matrix.action != 'skip'
        env:
          ITEM_ID: ${{ matrix.item_id }}
        run: |
          echo "### 🎙️ Pipeline Guard Transcribe: $ITEM_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tautan Arsip**: [https://archive.org/details/$ITEM_ID](https://archive.org/details/$ITEM_ID)" >> "$GITHUB_STEP_SUMMARY"

  describe:
    name: "🧠 Describe: ${{ matrix.item_id }}"
    needs: [scan, transcribe]
    if: always() && needs.scan.outputs.has_describe == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.scan.outputs.describe_matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install System Dependencies
        if: matrix.action != 'skip'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2 internetarchive

      - name: Configure Swap
        if: matrix.action != 'skip'
        env:
          QUANT: ${{ inputs.qwen_quant || 'Q8_0' }}
        run: |
          echo "=== Membersihkan Ruang Disk Runner ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true
          df -h /
          QUANT_VAL="${QUANT:-Q8_0}"
          SWAP_SIZE="32G"
          if [ "$QUANT_VAL" = "Q8_0" ]; then
            SWAP_SIZE="40G"
          elif [ "$QUANT_VAL" = "Q4_K_M" ]; then
            SWAP_SIZE="24G"
          fi
          echo "Mengalokasikan ${SWAP_SIZE} swapfile untuk model Qwen 35B ${QUANT_VAL}..."
          sudo fallocate -l "${SWAP_SIZE}" /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=32768
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: Download Qwen3.6-35B GGUF Model with aria2c
        if: matrix.action != 'skip'
        env:
          QUANT: ${{ inputs.qwen_quant || 'Q8_0' }}
        run: |
          mkdir -p "$HOME/qwen"
          QUANT_VAL="${QUANT:-Q8_0}"
          MODEL_URL="https://huggingface.co/hesamation/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled-GGUF/resolve/main/Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.${QUANT_VAL}.gguf"
          MODEL_FILE="Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled.${QUANT_VAL}.gguf"
          echo "[ INFO ] Mengunduh model Qwen 35B $QUANT_VAL via aria2c..."
          aria2c -x 16 -s 16 -k 1M --file-allocation=none \
            --allow-overwrite=true --auto-file-renaming=false \
            -d "$HOME/qwen" -o "$MODEL_FILE" "$MODEL_URL"
          echo "MODEL_PATH=$HOME/qwen/$MODEL_FILE" >> $GITHUB_ENV

      - name: Download Existing Transcript from Archive.org
        if: matrix.action != 'skip'
        env:
          ITEM_ID: ${{ matrix.item_id }}
          SRT_URL: ${{ matrix.srt_url }}
        run: |
          mkdir -p transcripts
          python3 -c "
          from pathlib import Path
          from main.core.downloader import download_archive_file
          import os, sys
          item = os.environ['ITEM_ID']
          url = os.environ.get('SRT_URL') or f'https://archive.org/download/{item}/transcript.srt'
          dest = Path('transcripts/transcript.srt')
          if not download_archive_file(url, dest, is_text=True):
              sys.exit(1)
          "

      - name: Start Llama Server
        if: matrix.action != 'skip'
        run: |
          chmod +x bin/linux-x64/llama-server
          nohup ./bin/linux-x64/llama-server \
            -m "$MODEL_PATH" \
            -c 32768 \
            -b 512 \
            -ub 256 \
            -t $(nproc) \
            --jinja \
            --port 8080 > server.log 2>&1 &
          READY=0
          for i in $(seq 1 120); do
            if curl -s http://127.0.0.1:8080/health | grep -qi "ok\|ready\|status"; then
              echo "[ OK ] llama-server siap merespons!"
              READY=1
              break
            fi
            sleep 5
          done
          if [ $READY -eq 0 ]; then
            echo "[ ERROR ] llama-server gagal siap!"
            cat server.log
            exit 1
          fi

      - name: Generate Description from SRT
        if: matrix.action != 'skip'
        run: |
          echo "[ INFO ] Membersihkan transkrip dengan clean.py..."
          python3 main/clean.py transcripts/transcript.srt > clean.txt
          echo "[ INFO ] Menghasilkan description.json via Qwen LLM..."
          python3 -u main/ask.py main/prompt.txt clean.txt transcripts/description.json http://127.0.0.1:8080/v1/chat/completions
          cat transcripts/description.json

      - name: Upload Description Artifact
        if: always() && matrix.action != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: guard-description-${{ matrix.item_id }}
          path: transcripts/description.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Push Description to Archive.org
        if: matrix.action != 'skip'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          ITEM_ID: ${{ matrix.item_id }}
        run: |
          python3 -u main/archive.py

      - name: Log Step Summary
        if: always() && matrix.action != 'skip'
        env:
          ITEM_ID: ${{ matrix.item_id }}
        run: |
          echo "### 🛡️ Pipeline Guard (Describe): $ITEM_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Model**: \`Qwen3.6-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tautan Arsip**: [https://archive.org/details/$ITEM_ID](https://archive.org/details/$ITEM_ID)" >> "$GITHUB_STEP_SUMMARY"