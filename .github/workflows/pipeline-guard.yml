name: Pipeline Guard

on:
  schedule:
    # Transcribe only: tiap 6 jam (WITA 00, 06, 12, 18 = UTC 16, 22, 04, 10)
    - cron: "0 4,10,16,22 * * *"
    # Describe only: tiap jam
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Jumlah rekaman maksimal yang diproses (kosong = otomatis: 10 transcribe, 5 describe)"
        required: false
        default: ""
      max_scan:
        description: "Jumlah rekaman terbaru yang diperiksa (default: 100)"
        required: false
        default: "100"
      item_id:
        description: "Archive.org Item ID tertentu (kosongkan jika scan otomatis)"
        required: false
        default: ""
      mode:
        description: "Strategi prioritas perbaikan arsip"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - describe_first
          - transcribe_only
          - describe_only
          - balanced
      whisper_model:
        description: "Model Whisper-CPP untuk transkripsi"
        required: false
        default: "medium"
        type: choice
        options:
          - medium
          - small
          - base
          - tiny
      gemini_model:
        description: "Model Gemini override (kosongkan untuk deteksi otomatis >= 2.5)"
        required: false
        default: ""

permissions:
  contents: read

# Satu run per jenis jadwal; run baru menunggu yang lama selesai
concurrency:
  group: pipeline-guard-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  scan:
    name: 🔍 Scan Archive Recordings
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      has_items: ${{ steps.scan.outputs.has_items }}
      count: ${{ steps.scan.outputs.count }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scan Archive.org Items
        id: scan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_MAX_SCAN: ${{ inputs.max_scan }}
          INPUT_ITEM_ID: ${{ inputs.item_id }}
        run: |
          ITEM_ARG=""
          if [ -n "$INPUT_ITEM_ID" ]; then
            ITEM_ARG="--item-id $INPUT_ITEM_ID"
          fi

          MAX_SCAN="${INPUT_MAX_SCAN:-100}"

          # Mode: manual dispatch pakai pilihan user, schedule ditentukan dari cron
          if [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          elif [ "$SCHEDULE" = "0 * * * *" ]; then
            MODE="describe_only"
          elif [ -n "$SCHEDULE" ]; then
            MODE="transcribe_only"
          else
            MODE="auto"
          fi

          # Limit: input manual menang, kalau kosong tentukan dari mode
          if [ -n "$INPUT_LIMIT" ]; then
            LIMIT="$INPUT_LIMIT"
          elif [ "$MODE" = "transcribe_only" ]; then
            LIMIT=10
          else
            LIMIT=5
          fi
          echo "Mode: $MODE | Limit: $LIMIT | Max scan: $MAX_SCAN"

          python main/guard.py scan \
            --limit "$LIMIT" \
            --max-scan "$MAX_SCAN" \
            --mode "$MODE" \
            $ITEM_ARG \
            --export-github-output

  process:
    name: "🛡️ ${{ matrix.action == 'transcribe_and_describe' && '🎙️ Transcribe' || '📝 Describe' }}: ${{ matrix.item_id }}"
    needs: scan
    if: needs.scan.outputs.has_items == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJson(needs.scan.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ── Kasus A: Transkripsi & Deskripsi Lengkap ───────────────────────────
      - name: Setup Transcription Environment
        if: matrix.action == 'transcribe_and_describe'
        run: python main/setup.py transcript

      - name: Transcribe Audio
        if: matrix.action == 'transcribe_and_describe'
        env:
          ITEM_ID: ${{ matrix.item_id }}
          AUDIO_URL: ${{ matrix.audio_url }}
          WHISPER_MODEL: ${{ inputs.whisper_model || 'medium' }}
        run: |
          echo "[ INFO ] Transcribing $ITEM_ID dari $AUDIO_URL menggunakan model: $WHISPER_MODEL..."
          python3 -u main/transcribe.py "$AUDIO_URL" "$WHISPER_MODEL"

      - name: Generate Description from SRT
        if: matrix.action == 'transcribe_and_describe'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
        run: |
          SRT_FILE="transcripts/transcript.srt"
          if [ ! -f "$SRT_FILE" ] && [ -f "transcripts/transcript.txt" ]; then
            SRT_FILE="transcripts/transcript.txt"
          fi
          MODEL_ARG=""
          if [ -n "$GEMINI_MODEL" ]; then
            MODEL_ARG="-m $GEMINI_MODEL"
          fi
          python main/descriptor.py "$SRT_FILE" -o transcripts/description.json $MODEL_ARG

      - name: Upload Transcript & Description to Archive.org
        if: matrix.action == 'transcribe_and_describe'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          ITEM_ID: ${{ matrix.item_id }}
        run: |
          python3 -u main/archive.py

      # ── Kasus B: Patch Description Saja ───────────────────────────────────
      - name: Setup Description Environment
        if: matrix.action == 'describe_only'
        run: python main/setup.py guard

      - name: Generate & Upload Description Only
        if: matrix.action == 'describe_only'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ITEM_ID: ${{ matrix.item_id }}
          SRT_URL: ${{ matrix.srt_url }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
        run: |
          SRT_ARG=""
          if [ -n "$SRT_URL" ]; then
            SRT_ARG="--srt-url $SRT_URL"
          fi
          MODEL_ARG=""
          if [ -n "$GEMINI_MODEL" ]; then
            MODEL_ARG="--model $GEMINI_MODEL"
          fi
          python3 -u main/guard.py fix-description \
            --item-id "$ITEM_ID" \
            $SRT_ARG \
            $MODEL_ARG

      # ── Log Summary ke GitHub Actions Step Summary ─────────────────────────
      - name: Log Step Summary
        if: always() && matrix.action != 'skip'
        env:
          ITEM_ID: ${{ matrix.item_id }}
          ACTION: ${{ matrix.action }}
        run: |
          echo "### 🛡️ Pipeline Guard: $ITEM_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Aksi**: \`$ACTION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tautan Arsip**: [https://archive.org/details/$ITEM_ID](https://archive.org/details/$ITEM_ID)" >> "$GITHUB_STEP_SUMMARY"

      # ── Artifact Backup ───────────────────────────────────────────────────
      - name: Upload Transcripts Artifact
        if: always() && matrix.action != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: guard-${{ matrix.item_id }}
          path: transcripts/
          if-no-files-found: ignore
          retention-days: 7