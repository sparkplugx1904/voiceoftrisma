name: 🧪 Test Local LLM (Llama.cpp & Qwen)

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: "URL download model GGUF (DeepSeek-R1-Distill-Qwen-14B)"
        required: false
        default: "https://huggingface.co/bartowski/DeepSeek-R1-Distill-Qwen-14B-GGUF/resolve/main/DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf"
      model_filename:
        description: "Nama file model GGUF"
        required: false
        default: "DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf"
      sample_item:
        description: "Archive.org Item ID untuk mengambil transkrip sampel (Jumat: vot-denpasar-20261106-183004, Sabtu: vot-denpasar-20261031-183004)"
        required: false
        default: "vot-denpasar-20261106-183004"
      context_size:
        description: "Kapasitas context size (tokens)"
        required: false
        default: "32768"

permissions:
  contents: read

jobs:
  test_llm:
    name: 🧠 Test Llama Server Inference
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ── 1. Aktifkan 24GB Swap untuk Model 27B ──────────────────────────────
      - name: Configure 24GB Swap
        run: |
          echo "=== Ruang Disk Runner ==="
          df -h /
          echo "Mengalokasikan 24GB swapfile tambahan secara instan..."
          sudo fallocate -l 24G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=24576
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          echo "=== Status Memori & Swap ==="
          free -h

      # ── 2. Download Model GGUF dengan aria2c (16 Koneksi Paralel) ──────────
      - name: Download GGUF Model with aria2
        env:
          MODEL_URL: ${{ inputs.model_url }}
          MODEL_FILENAME: ${{ inputs.model_filename }}
        run: |
          mkdir -p "$HOME/qwen"
          MODEL_PATH="$HOME/qwen/$MODEL_FILENAME"
          echo "[ INFO ] Menginstal aria2..."
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2

          echo "[ INFO ] Mengunduh model via aria2c (16 thread paralel)..."
          aria2c -x 16 -s 16 -k 1M --file-allocation=none \
            --summary-interval=5 --console-log-level=warn \
            -d "$HOME/qwen" -o "$MODEL_FILENAME" "$MODEL_URL"

          echo "[ OK ] Download selesai:"
          ls -lh "$MODEL_PATH"

      # ── 3. Ambil Transkrip Sampel & Jalankan clean.py ───────────────────────
      - name: Prepare Sample Transcript
        env:
          SAMPLE_ITEM: ${{ inputs.sample_item }}
        run: |
          mkdir -p transcripts
          python3 -c "
          from pathlib import Path
          from main.core.downloader import download_archive_file
          import os, sys
          item = os.environ['SAMPLE_ITEM']
          url = f'https://archive.org/download/{item}/transcript.srt'
          dest = Path('transcripts/transcript.srt')
          if not download_archive_file(url, dest, is_text=True):
              sys.exit(1)
          "
          echo "[ INFO ] Membersihkan transkrip dengan main/clean.py..."
          python3 main/clean.py transcripts/transcript.srt > clean.txt
          echo "[ OK ] clean.txt selesai dibuat: $(wc -l < clean.txt) baris (seluruh durasi siaran ~2 jam penuh)."
          echo "Rentang awal transkrip : $(head -n 1 clean.txt | cut -c 1-90)..."
          echo "Rentang akhir transkrip: $(tail -n 1 clean.txt | cut -c 1-90)..."

      # ── 4. Jalankan llama-server di Background ──────────────────────────────
      - name: Start Llama Server
        env:
          MODEL_FILENAME: ${{ inputs.model_filename }}
          CTX_SIZE: ${{ inputs.context_size }}
        run: |
          chmod +x bin/linux-x64/llama-server
          MODEL_PATH="$HOME/qwen/$MODEL_FILENAME"

          echo "[ INFO ] Memulai llama-server pada port 8080..."
          nohup ./bin/linux-x64/llama-server \
            -m "$MODEL_PATH" \
            -c "$CTX_SIZE" \
            -b 512 \
            -ub 256 \
            -t $(nproc) \
            --jinja \
            --port 8080 > server.log 2>&1 &

          echo "[ INFO ] Menunggu server siap merespons..."
          READY=0
          for i in $(seq 1 120); do
            if curl -s http://127.0.0.1:8080/health | grep -qi "ok\|ready\|status"; then
              echo "[ OK ] llama-server siap merespons!"
              READY=1
              break
            fi
            echo "Menunggu inisialisasi model ($i/120)..."
            sleep 5
          done

          if [ $READY -eq 0 ]; then
            echo "[ ERROR ] llama-server gagal siap dalam waktu 10 menit!"
            echo "=== Isi server.log ==="
            cat server.log
            exit 1
          fi

      # ── 5. Jalankan ask.py untuk Meminta Respons JSON ───────────────────────
      - name: Run Inference (ask.py)
        run: |
          echo "[ INFO ] Mengirim prompt dan clean.txt ke llama-server..."
          python3 -u main/ask.py main/prompt.txt clean.txt out.json http://127.0.0.1:8080/v1/chat/completions
          echo "=== Hasil out.json ==="
          cat out.json

          echo "### 🧠 Hasil Eksekusi Local LLM (${{ inputs.model_filename }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Sample Item**: [\`${{ inputs.sample_item }}\`](https://archive.org/details/${{ inputs.sample_item }})" >> $GITHUB_STEP_SUMMARY
          if [ -s think.txt ]; then
            echo "<details><summary>💭 Lihat Jalur Penalaran (&lt;think&gt; trace)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat think.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
          echo "#### 📄 Output JSON Terformat:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat out.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      # ── 6. Simpan Artifact Hasil Uji Coba ───────────────────────────────────
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-local-llm-output
          path: |
            out.json
            think.txt
            clean.txt
            server.log
          retention-days: 7
