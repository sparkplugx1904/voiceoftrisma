name: 🔄 Retranscribe Broken Archives

on:
  schedule:
    # Berjalan 6x sehari (tiap 4 jam: jam 00, 04, 08, 12, 16, 20 WITA = UTC 16, 20, 00, 04, 08, 12)
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Jumlah instance runner paralel per batch (default: 15)"
        required: false
        default: "15"
      item_id:
        description: "Archive.org Item ID tertentu (kosongkan jika otomatis sesuai antrean)"
        required: false
        default: ""
      whisper_model:
        description: "Model Whisper.cpp (default: large-v3-turbo)"
        required: false
        default: "large-v3-turbo"
        type: choice
        options:
          - large-v3-turbo
          - medium
          - small
          - base
          - tiny

concurrency:
  group: retranscribe-${{ inputs.item_id || github.run_id }}
  cancel-in-progress: false

jobs:
  scan:
    name: "🔍 Scan & Queue Retranscription Batch"
    runs-on: ubuntu-latest
    outputs:
      retranscribe_matrix: ${{ steps.scan.outputs.retranscribe_matrix }}
      has_items: ${{ steps.scan.outputs.has_items }}
      total_count: ${{ steps.scan.outputs.total_count }}
      completed_count: ${{ steps.scan.outputs.completed_count }}
      pending_count: ${{ steps.scan.outputs.pending_count }}

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Scan Archive.org Target Recordings
        id: scan
        run: |
          ITEM_ARG=""
          if [ -n "${{ inputs.item_id }}" ]; then
            ITEM_ARG="--item-id ${{ inputs.item_id }}"
          fi
          LIMIT="${{ inputs.limit || '15' }}"
          python3 -u main/retranscribe.py scan --limit "$LIMIT" $ITEM_ARG

  transcribe:
    name: "🎙️ Retranscribe: ${{ matrix.item_id }}"
    needs: scan
    if: needs.scan.outputs.has_items == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include: ${{ fromJson(needs.scan.outputs.retranscribe_matrix) }}

    steps:
      - name: Checkout Codebase
        if: matrix.action != 'skip'
        uses: actions/checkout@v4

      - name: Setup Python
        if: matrix.action != 'skip'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Transcription Environment
        if: matrix.action != 'skip'
        run: python main/setup.py transcript

      - name: Transcribe Audio with Synchronized Clock (No Silenceremove)
        if: matrix.action != 'skip'
        env:
          ITEM_ID: ${{ matrix.item_id }}
          AUDIO_URL: ${{ matrix.audio_url }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
        run: |
          MODEL="${WHISPER_MODEL:-large-v3-turbo}"
          if [ "$MODEL" = "true" ] || [ -z "$MODEL" ]; then
            MODEL="large-v3-turbo"
          fi
          echo "[ INFO ] Retranscribing $ITEM_ID dari $AUDIO_URL menggunakan model: $MODEL..."
          python3 -u main/transcribe.py "$AUDIO_URL" "$MODEL"

      - name: Upload Transcript Artifact
        if: always() && matrix.action != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: retranscribe-${{ matrix.item_id }}
          path: transcripts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Push Synchronized Transcript to Archive.org
        if: matrix.action != 'skip'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          ITEM_ID: ${{ matrix.item_id }}
        run: |
          echo "[ INFO ] Mengunggah transcript.srt & transcript.json baru ke $ITEM_ID..."
          python3 -u main/archive.py
